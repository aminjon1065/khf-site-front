name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: http://127.0.0.1:38848/api/v1
      CMS_BUILD_MODE: production
      CMS_READINESS_TIMEOUT_MS: 2000
      LHCI_STRICT: ${{ github.event_name == 'schedule' && '1' || '0' }}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:38848/api/v1
      NEXT_PUBLIC_RUM_SAMPLE_RATE: "1"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      RUM_INGEST_SECRET: ci-rum-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start deterministic CMS fixture
        shell: bash
        run: |
          node tests/fixtures/cms-server.mjs > "$RUNNER_TEMP/cms-fixture.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$API_URL/ready" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cms-fixture.log"
          exit 1

      - name: Verify generated API types
        run: npm run api:types:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Check frontend bundle budgets
        run: npm run bundle:report

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lighthouse-reports
          path: |
            lighthouse-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend bundle report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-bundle-report
          path: bundle-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload CMS fixture log
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cms-fixture-log
          path: ${{ runner.temp }}/cms-fixture.log
          if-no-files-found: ignore
          retention-days: 7
